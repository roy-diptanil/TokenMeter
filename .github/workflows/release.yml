# Publishes a versioned release when a change to VERSION lands on main.
#   1. Bump VERSION (MAJOR.MINOR.PATCH) in a pull request and merge it.
#   2. This workflow builds the universal app, tags v<VERSION> at the merged commit, and creates the GitHub release
#      with TokenMeter.zip, .sha256, .commit and .version (notes are generated from merged PR titles).
# Idempotent: if the tag already exists it does nothing, so a manual re-run is safe.
# There is no rolling "latest build of main" release: anyone who wants main builds from source.
# Only first-party actions plus the preinstalled gh CLI with the built-in github.token.
name: release

on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Read VERSION
        id: v
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::VERSION must be MAJOR.MINOR.PATCH (found '$VERSION')"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check whether the tag already exists
        id: tag
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${{ steps.v.outputs.version }}" >/dev/null 2>&1; then
            echo "::notice::Tag v${{ steps.v.outputs.version }} already exists; nothing to release."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Self tests
        if: steps.tag.outputs.exists == 'false'
        run: swift run SelfTest

      - name: Package release files
        if: steps.tag.outputs.exists == 'false'
        run: bash scripts/package-release.sh

      - name: Check deployment target is macOS 14.0
        if: steps.tag.outputs.exists == 'false'
        run: bash scripts/check-min-os.sh build/TokenMeter.app

      - name: Create release
        if: steps.tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            build/TokenMeter.zip build/TokenMeter.zip.sha256 build/TokenMeter.commit build/TokenMeter.version \
            --target "$GITHUB_SHA" --title "TokenMeter $VERSION" --generate-notes --latest
